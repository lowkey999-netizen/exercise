name: Auto-merge Exercism PRs
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'exercism-solutions-syncer[bot]' || contains(github.event.pull_request.user.login, 'exercism')
    steps:
      - name: Automatically merge Exercism PR
        run: gh pr merge --admin --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
